name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check and build with tsgo
        run: npm run build
      - name: Bundle for Apps Script
        run: npm run bundle
      - name: Format check
        run: npm run format:check
      - name: Test
        run: CI=true npx jest --watchAll=false --ci
